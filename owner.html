<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owners Form</title>
    <link rel="stylesheet" href="owner.css">
</head>
<body>
    <section class="container">
        <header>Owners Form</header>
        <form action="#" class="form">
            <div class="input-box">
                <label for="">Fullname</label>
                <input type="text" placeholder="Enter your name" required>
            </div>
            <div class="input-box">
                <label for="">Email Address</label>
                <input type="text" placeholder="Enter Email Address" required>
            </div>
            <div class="column">
                <div class="input-box">
                    <label for="">Phone Number(PH)</label>
                    <input type="number" placeholder="Enter Phone Number" required>
                </div>
                <div class="input-box">
                    <label for="">Birth Date</label>
                    <input type="date" placeholder="Enter BirthDate" required>
                </div>
            </div>
            <div class="gender-">
                <h3>Gender</h3>
                <div class="gender-option">
                    <div class="gender">
                        <input type="radio" id="check" name="gender" checked>
                        <label for="check-male">Male</label>
                    </div>
                    <div class="gender">
                        <input type="radio" id="check" name="gender">
                        <label for="check-female">Female</label>
                    </div>
                    <div class="gender">
                        <input type="radio" id="check" name="gender">
                        <label for="check-other">Prefer not to say</label>
                    </div>
                </div>
            </div>
            <div class="pet-">
                <h3>Type Of Pet</h3>
                <div class="pet-option">
                    <div class="pet">
                        <input type="radio" id="check" name="pet" checked>
                        <label for="check-male">Dog</label>
                    </div>
                    <div class="pet">
                        <input type="radio" id="check" name="pet">
                        <label for="check-female">Cat</label>
                    </div>
                </div>
            </div>
            <div class="input-box addres">
                <label for="">Address</label>
                <input type="text" placeholder="Enter Street Address" required>
                <input type="text" placeholder="Enter Street Address Line">
                <input type="text" placeholder="Enter Your City" required>
                <div class="column">
                <input type="text" placeholder="Enter Your Region" required>
                <input type="number" placeholder="Enter postal Code" required>
                </div>
            </div>
            <div class="input-box">
                <label for="captcha">Captcha: <span id="captcha-question"></span></label>
                <input type="text" id="captcha-answer" placeholder="Enter answer here" required>
            </div>
            <button>Submit</button>
        </form>
    </section>
    <script src="owner.js"></script>
</body>
</html>
